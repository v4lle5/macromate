[project]
name = "macromate"
version = "0.4.0"
description = "Local calorie, nutrient, food and barcode tracking inside Home Assistant"
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
branch = true
source = ["custom_components/macromate", "tools"]

[tool.coverage.report]
show_missing = true
fail_under = 85
