name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare private test scratch
        run: |
          scratch=$(mktemp -d "$RUNNER_TEMP/macromate.XXXXXX")
          printf 'TMPDIR=%s\n' "$scratch" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pure image-test dependency
        run: python -m pip install Pillow==12.3.0
      - name: Pure tests (HA-dependent cases may skip)
        run: python -m unittest discover -s tests -v
      - name: Compile sources
        run: python -m compileall -q custom_components tests tools

  ha-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare private test scratch
        run: |
          scratch=$(mktemp -d "$RUNNER_TEMP/macromate.XXXXXX")
          printf 'TMPDIR=%s\n' "$scratch" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"
      - name: Install pinned Home Assistant runtime
        run: python -m pip install -r requirements-dev.txt
      - name: Lint, format, framework, native HA and minimum 85 percent branch coverage
        run: python tools/check.py --python-only

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare private test scratch
        run: |
          scratch=$(mktemp -d "$RUNNER_TEMP/macromate.XXXXXX")
          printf 'TMPDIR=%s\n' "$scratch" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"
      - name: Install HA for captured browser payload contract checks
        run: python -m pip install homeassistant==2026.10.1 home-assistant-frontend==20260930.3 recipe-scrapers==15.12.0 beautifulsoup4==4.14.3 Pillow==12.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.1"
      - name: Install pinned test-only browser dependencies
        env:
          FRONTEND_DEPS: ${{ env.TMPDIR }}/frontend-deps
        run: |
          mkdir -p "$FRONTEND_DEPS"
          cp tests/frontend/deps.package.json "$FRONTEND_DEPS/package.json"
          cp tests/frontend/deps.package-lock.json "$FRONTEND_DEPS/package-lock.json"
          npm ci --prefix "$FRONTEND_DEPS" --ignore-scripts --no-fund
          node "$FRONTEND_DEPS/node_modules/playwright/cli.js" install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install controlled unified build dependencies without upstream hooks
        env:
          MACROMATE_BUILD_DEPS: ${{ env.TMPDIR }}/build-deps
        run: |
          mkdir -p "$MACROMATE_BUILD_DEPS"
          cp frontend/unified-src/package.json "$MACROMATE_BUILD_DEPS/package.json"
          cp frontend/unified-src/package-lock.json "$MACROMATE_BUILD_DEPS/package-lock.json"
          npm ci --ignore-scripts --no-fund --prefix "$MACROMATE_BUILD_DEPS"
      - name: Unified rebuild, connected workflows and installed native HA acceptance
        env:
          FRONTEND_DEPS: ${{ env.TMPDIR }}/frontend-deps
          PLAYWRIGHT_DIR: ${{ env.TMPDIR }}/frontend-deps/node_modules
          MACROMATE_BUILD_DEPS: ${{ env.TMPDIR }}/build-deps
          EVIDENCE_DIR: ${{ env.TMPDIR }}/unified-evidence
        run: |
          export CHROMIUM_PATH=$(node -e "console.log(require(process.env.FRONTEND_DEPS+'/node_modules/playwright').chromium.executablePath())")
          export CHROMIUM="$CHROMIUM_PATH"
          export HA_PYTHON=$(command -v python)
          node --test tests/frontend/macromate-unified-build.test.mjs
          node tests/frontend/macromate-unified-verify.mjs
          python -m unittest discover -s tests -p test_unified_packaging.py -v
          node --test tests/frontend/macromate-card.test.mjs tests/frontend/macromate-artifact.test.mjs
          python tests/ha/native_unified_browser.py
      - name: Browser and real barcode decoder tests
        env:
          FRONTEND_DEPS: ${{ env.TMPDIR }}/frontend-deps
        run: |
          export CHROMIUM_PATH=$(node -e "console.log(require(process.env.FRONTEND_DEPS+'/node_modules/playwright').chromium.executablePath())")
          export HA_PYTHON=$(command -v python)
          node tools/check_frontend.mjs
          node --test tests/frontend/*.test.mjs
      - name: Preserve nutrition layout screenshots and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nutrition-ui-evidence
          path: |
            ${{ env.TMPDIR }}/unified-evidence/nutrition-compact-*.png
            ${{ env.TMPDIR }}/unified-evidence/compact-layouts.json
            ${{ env.TMPDIR }}/unified-evidence/verification.json
          if-no-files-found: ignore
          retention-days: 14

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: hacs/action@main
        with:
          category: integration
