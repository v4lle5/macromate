name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pure tests (HA-dependent cases may skip)
        run: python -m unittest discover -s tests -v
      - name: Compile sources
        run: python -m compileall -q custom_components tests tools

  ha-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"
      - name: Install pinned Home Assistant runtime
        run: python -m pip install homeassistant==2026.10.1
      - name: All framework/provider/model tests
        run: python -m unittest discover -s tests -v
      - name: Coordinator, action and privacy boundaries
        run: python -m unittest discover -s tests/ha -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"
      - name: Install HA for captured browser payload contract checks
        run: python -m pip install homeassistant==2026.10.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned test-only browser dependencies
        env:
          FRONTEND_DEPS: /home/runner/macromate-frontend-deps
        run: |
          mkdir -p "$FRONTEND_DEPS"
          cp tests/frontend/deps.package.json "$FRONTEND_DEPS/package.json"
          cp tests/frontend/deps.package-lock.json "$FRONTEND_DEPS/package-lock.json"
          npm ci --prefix "$FRONTEND_DEPS" --ignore-scripts --no-fund
          node "$FRONTEND_DEPS/node_modules/playwright/cli.js" install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Browser and real barcode decoder tests
        env:
          FRONTEND_DEPS: /home/runner/macromate-frontend-deps
        run: |
          export CHROMIUM_PATH=$(node -e "console.log(require(process.env.FRONTEND_DEPS+'/node_modules/playwright').chromium.executablePath())")
          export HA_PYTHON=$(command -v python)
          node --test tests/frontend/*.test.mjs

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
