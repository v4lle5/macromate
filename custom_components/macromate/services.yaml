legacy_import:
  name: Import legacy stores
  description: Atomically import explicitly supplied standalone stores and image bytes as an administrator.
    Never reads source files or fetches URLs.
  fields:
    source:
      name: Source
      description: Exact standalone integration identity.
      required: true
      selector:
        select:
          options:
          - recipe_manager
    stores:
      name: Stores
      description: Exact Store keys mapped to raw data or supported versioned envelopes.
      required: true
      selector:
        object: {}
    images:
      name: Images
      description: Exact local image references mapped to base64 image bytes. All local references must
        be supplied; unused assets are rejected.
      required: false
      selector:
        object: {}
    preserve_permissions:
      name: Preserve permissions
      description: Explicit administrator choice. False resets imported ownership to the importer and
        makes records private; true retains verified legacy permissions.
      required: true
      selector:
        boolean: {}
    confirm:
      name: Confirm
      description: Must be explicitly true.
      required: true
      selector:
        boolean: {}
    request_id:
      name: Request id
      description: Required stable retry ID; keep the exact payload after an uncertain write.
      required: true
      selector:
        text: {}
